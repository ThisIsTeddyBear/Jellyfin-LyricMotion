name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v3.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          EXPECTED="v${VERSION}"
          ACTUAL="${{ steps.release_tag.outputs.tag }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Release tag $ACTUAL does not match VERSION=$VERSION (expected $EXPECTED)." >&2
            exit 1
          fi

      - name: Run release validation gate
        run: sh scripts/test-all.sh

      - name: Build deterministic release archive
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          mkdir -p dist
          python3 scripts/package_release.py \
            --version "$VERSION" \
            --output "dist/jellyfin-lyric-motion-v${VERSION}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Jellyfin LyricMotion ${{ steps.release_tag.outputs.tag }} · LyricG2P 6.5.1
          body_path: GITHUB-RELEASE.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/jellyfin-lyric-motion-v*.zip
            dist/jellyfin-lyric-motion-v*.zip.sha256
