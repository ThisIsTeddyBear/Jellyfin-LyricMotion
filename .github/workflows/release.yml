name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release version
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: Run release tests
        run: |
          node --check src/jellyfin-lyric-motion.js
          node scripts/test_overlap_background.js
          node scripts/test_tv_overlap.js
          node scripts/test_script_safety.js
          node scripts/test_release_contract.js
          python -m unittest discover -s scripts -p "test_*.py"
          sh -n scripts/install.sh scripts/uninstall.sh
      - name: Build deterministic release assets
        run: python scripts/package_release.py --version "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/RELEASE-NOTES-${version}.md"
          gh release create "$GITHUB_REF_NAME" \
            "dist/local-testing/jellyfin-lyric-motion-v${version}.zip" \
            "dist/local-testing/jellyfin-lyric-motion-v${version}.zip.sha256" \
            --title "Jellyfin LyricMotion ${GITHUB_REF_NAME}" \
            --notes-file "$notes" \
            --verify-tag
