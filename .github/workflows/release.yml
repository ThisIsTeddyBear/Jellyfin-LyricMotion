name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v3.2.5'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify release versions
        id: versions
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          LYRICG2P_VERSION="$(tr -d '\r\n' < LYRICG2P_VERSION)"
          ACTUAL="${{ steps.release_tag.outputs.tag }}"
          EXPECTED="v${VERSION}"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Release tag $ACTUAL does not match VERSION=$VERSION (expected $EXPECTED)." >&2
            exit 1
          fi

          if [ -z "$LYRICG2P_VERSION" ]; then
            echo "LYRICG2P_VERSION is empty." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "lyricg2p=$LYRICG2P_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run full release validation gate
        run: sh scripts/test-all.sh

      - name: Build platform release archives
        shell: bash
        run: |
          rm -rf dist
          python3 scripts/package_release.py \
            --version "${{ steps.versions.outputs.version }}" \
            --platform all \
            --output-dir dist

      - name: Verify release assets
        shell: bash
        run: |
          set -eu
          VERSION="${{ steps.versions.outputs.version }}"
          for PLATFORM in windows linux macos docker; do
            ZIP="dist/jellyfin-lyric-motion-v${VERSION}-${PLATFORM}.zip"
            SUM="${ZIP}.sha256"
            test -s "$ZIP"
            test -s "$SUM"
            unzip -t "$ZIP" >/dev/null
            (cd dist && sha256sum -c "$(basename "$SUM")")
          done

          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 4
          test "$(find dist -maxdepth 1 -type f -name '*.zip.sha256' | wc -l)" -eq 4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Jellyfin LyricMotion ${{ steps.release_tag.outputs.tag }} · LyricG2P ${{ steps.versions.outputs.lyricg2p }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/jellyfin-lyric-motion-v*-windows.zip
            dist/jellyfin-lyric-motion-v*-windows.zip.sha256
            dist/jellyfin-lyric-motion-v*-linux.zip
            dist/jellyfin-lyric-motion-v*-linux.zip.sha256
            dist/jellyfin-lyric-motion-v*-macos.zip
            dist/jellyfin-lyric-motion-v*-macos.zip.sha256
            dist/jellyfin-lyric-motion-v*-docker.zip
            dist/jellyfin-lyric-motion-v*-docker.zip.sha256
