name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript and overlap runtime
        run: |
          node --check src/jellyfin-lyric-motion.js
          node scripts/test_overlap_background.js
          node scripts/test_tv_overlap.js
          node scripts/test_script_safety.js
          node scripts/test_release_contract.js
      - name: Validate converter
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Validate POSIX scripts
        run: sh -n scripts/install.sh scripts/uninstall.sh
      - name: Build release package
        run: python scripts/package_release.py --version "$(cat VERSION)"

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @('scripts/install.ps1', 'scripts/uninstall.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$null, [ref]$errors
            )
            if ($errors.Count) {
              $errors | Write-Error
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
